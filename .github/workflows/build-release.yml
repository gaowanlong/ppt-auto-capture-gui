name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g., v0.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
      - name: Install Rust quality tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Validate release tag
        run: bash scripts/validate-release-tag.sh "$RELEASE_TAG"
      - name: Run Rust tests
        run: cargo test --all-targets --all-features
      - name: Run regression contracts
        run: |
          bash tests/test_macos_dmg_packaging.sh
          bash tests/test_release_tag.sh
          bash tests/test_release_workflow.sh
          ruby tests/test_ci_workflow.rb
          ruby tests/test_action_runtime_versions.rb
      - name: Check changed Rust formatting
        run: bash scripts/check-rustfmt-changed.sh
      - name: Check Clippy warning baseline
        run: bash scripts/check-clippy-baseline.sh

  build-windows:
    name: Build Windows (x86_64-msvc)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
      - name: Install Rust (windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          copy target\x86_64-pc-windows-msvc\release\ppt-auto-capture-gui.exe artifacts\
          copy README.md artifacts\
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppt-auto-capture-gui-windows-x86_64-msvc
          path: artifacts/

  build-linux:
    name: Build Linux (x86_64)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Build release
        run: cargo build --release
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/release/ppt-auto-capture-gui artifacts/
          cp README.md artifacts/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppt-auto-capture-gui-linux-x86_64
          path: artifacts/

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
      - name: Install Rust (Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin
      - name: Build application DMG
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          bash scripts/package-macos-dmg.sh \
            target/aarch64-apple-darwin/release/ppt-auto-capture-gui \
            "$RELEASE_VERSION" \
            artifacts/ppt-auto-capture-gui-macos-apple-silicon.dmg
          cp README.md artifacts/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppt-auto-capture-gui-macos-apple-silicon
          path: artifacts/

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Create release tarballs
        run: |
          mkdir -p release-files
          cp downloaded-artifacts/ppt-auto-capture-gui-windows-x86_64-msvc/ppt-auto-capture-gui.exe release-files/
          cp downloaded-artifacts/ppt-auto-capture-gui-windows-x86_64-msvc/README.md release-files/README-windows.md
          tar czf release-files/ppt-auto-capture-gui-linux-x86_64.tar.gz -C downloaded-artifacts/ppt-auto-capture-gui-linux-x86_64 ppt-auto-capture-gui README.md
          cp downloaded-artifacts/ppt-auto-capture-gui-macos-apple-silicon/ppt-auto-capture-gui-macos-apple-silicon.dmg release-files/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/ppt-auto-capture-gui.exe
            release-files/ppt-auto-capture-gui-linux-x86_64.tar.gz
            release-files/ppt-auto-capture-gui-macos-apple-silicon.dmg
            release-files/README-windows.md
